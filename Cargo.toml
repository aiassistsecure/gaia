[workspace]
resolver = "2"
members = ["crates/hearth-core", "crates/hearth-resolve", "crates/hearth-store", "crates/hearth-pull", "crates/hearth-api", "crates/hearth-serve", "crates/hearth-node", "crates/hearth-py", "crates/gaia-api"]

[workspace.package]
version = "0.4.7"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/aiassistsecure/hearth"
homepage = "https://github.com/aiassistsecure/hearth"
authors = ["Interchained LLC"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
